# Baseline training experiment: GRUCTC at the hyperparameters settled by
# the round-5 four-way s15 architecture comparison (docs/FINDINGS.md:
# "Day layers are unstable when trained jointly across many sessions"),
# trained on one of the Switchboard cut-point sweep's split manifests.
#
# The split manifest itself is NOT referenced here -- it's passed
# separately via `--split` at the command line (scripts/02_train.py), so
# this ONE experiment config is reused across all four cut points
# (temporal_s01_s05/s10/s15/s20_switchboard) plus the all-corpora
# fallback, rather than needing a near-duplicate config per split.

experiment_name: switchboard_baseline
data_config: configs/data/t15.yaml

model:
  hidden_size: 512          # docs/DESIGN.md section 10: [judgment call -- sweep this]
  n_layers: 3                # docs/DESIGN.md section 10: [judgment call -- revisit if the baseline underfits]
  dropout: 0.4                # docs/DESIGN.md section 10: [convention]
  bidirectional: false        # docs/DESIGN.md section 10: [principled]
  use_day_layers: true        # docs/DESIGN.md section 10 + 5. KEPT by the pre-registered keep/drop
                              # rule (docs/FINDINGS.md: "Pre-committed rule for keeping or dropping
                              # day layers"): best day-layer config (diagonal, lambda 300, patched)
                              # reached val PER 0.16932 vs 0.1697 for the best no-day-layer config
                              # -- a -0.0004 gap, far inside the 0.03 band. Question 3's Arm 2 and
                              # the +0.313 day-layer-gap finding both depend on this staying on.
  day_layer_parameterization: diagonal
                              # [judgment call]. 1,024 params/session (per-channel gain+offset), vs
                              # "full"'s 262,656. "full" DIVERGED when all 45 slices trained jointly
                              # even at lambda 3000 (round-5 run 3: best 0.251 @ ep38, then train
                              # loss rose 1.4 -> 3.5); "diagonal" was stable AND matched the
                              # no-day-layer PER, with slices staying ~identity (max|W-I| ~ 0.04
                              # after 150 epochs). Also the parameterization Arm 2 can actually fit
                              # from 10-50 labelled sentences. See docs/DESIGN.md section 5.
  input_dropout: 0.0          # docs/DESIGN.md section 10: [judgment call]
  smoothing_sigma_bins: 2.0   # docs/DESIGN.md section 10: [principled]
  patch_size: 14              # [principled] -- matches the published pipeline (concatenate 14
  patch_stride: 4             # consecutive 20 ms bins, stepped every 4 -> 7,168-dim GRU input at an
                              # 80 ms output stride). Round-5: patching cut s15 val PER from the
                              # ~0.196-0.200 no-patch plateau (run 4, still not converged at ep149)
                              # to ~0.169-0.170 (runs 1-2). ctc_input_lengths divides lengths to the
                              # patched axis before nn.CTCLoss -- see gru_ctc.py's CTC length
                              # contract and CLAUDE.md's known pitfalls.

training:
  # Values below are ordinary ML-engineering starting points, NOT swept
  # against this project's data, EXCEPT day_layer_penalty (measured -- see
  # its comment) and max_epochs/patience (set from observed convergence).
  seed: 0
  max_epochs: 150             # bumped from 100: the round-5 comparison ran 150 epochs and the
                              # chosen config's best epoch was 106 (past 100). 150 leaves headroom
                              # without early stopping while every good config has plateaued well
                              # before then. See docs/FINDINGS.md ("Day layers are unstable...").
  patience: 150               # early stopping still effectively disabled (no 150-epoch run can
                              # accumulate 150 epochs-since-improvement) -- see docs/FINDINGS.md
                              # ("Early stopping disabled for the cut-point sweep"). checkpoint_best.pt
                              # selects the best epoch regardless of run length.
  batch_size: 32
  learning_rate: 0.001
  grad_clip: 1.0               # matches training/loop.py's train_one_epoch default
  day_layer_penalty: 300.0    # lambda for DayLayers.identity_penalty() -- the identity-anchored
                              # (NOT zero-anchored) regulariser. Measured on a real s15 run (penalty
                              # computed but not applied): lambda=300 contributes ~0.11% / 3.05% /
                              # 7.89% of total loss at epochs 1 / 5 / 10 -- an anchor, not a
                              # dominator. lambda=3000 reaches 46% by epoch 10 and starved CTC
                              # (round-5 run 3 diverged). See docs/FINDINGS.md ("Choosing the
                              # identity-anchored day-layer penalty's lambda", "Day layers are
                              # unstable..."). With "diagonal" the penalty is barely load-bearing
                              # (slices stay near identity on their own) but is kept for the
                              # cut-point sweep's smaller train sets where drift pressure is higher.
  amp: true                    # only actually used when a CUDA device is available -- see scripts/02_train.py
  num_workers: 2                 # docs/DESIGN.md section 8; full measurement history in docs/FINDINGS.md
                                  # ("Storage medium, not DataLoader configuration, was the training
                                  # bottleneck"). Steady-state (3rd epoch) epoch time / dataloader-wait fraction:
                                  #   num_workers=0: 62.3s / 24.8%   num_workers=1: 42.9s / 0.9%
                                  #   num_workers=2: 41.9s / 0.9%    num_workers=4: 43.1s / 1.6%
                                  # Any num_workers >= 1 fully hides I/O behind GPU compute; 1/2/4 are within ~3%
                                  # of each other (bottleneck is now GPU compute, not I/O). num_workers=2 measured
                                  # marginally fastest and leaves more CPU headroom than 4. persistent_workers=True
                                  # and pin_memory=True are set in scripts/02_train.py whenever num_workers > 0,
                                  # not configurable from here.

logging:
  wandb_project: b2t-drift
  wandb_group: cutpoint_sweep   # training/logging.py: groups the sweep's runs together in the wandb UI
  mlflow_experiment: b2t-drift
