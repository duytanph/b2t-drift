# Baseline training experiment: GRUCTC at its documented default
# hyperparameters (docs/DESIGN.md section 10, "Model hyperparameters"),
# trained on one of the Switchboard cut-point sweep's split manifests.
#
# The split manifest itself is NOT referenced here -- it's passed
# separately via `--split` at the command line (scripts/02_train.py), so
# this ONE experiment config is reused across all four cut points
# (temporal_s01_s05/s10/s15/s20_switchboard) plus the all-corpora
# fallback, rather than needing a near-duplicate config per split.

experiment_name: switchboard_baseline
data_config: configs/data/t15.yaml

model:
  hidden_size: 512          # docs/DESIGN.md section 10: [judgment call -- sweep this]
  n_layers: 3                # docs/DESIGN.md section 10: [judgment call -- revisit if the baseline underfits]
  dropout: 0.4                # docs/DESIGN.md section 10: [convention]
  bidirectional: false        # docs/DESIGN.md section 10: [principled]
  use_day_layers: true        # docs/DESIGN.md section 10: [principled]
  input_dropout: 0.0          # docs/DESIGN.md section 10: [judgment call]
  smoothing_sigma_bins: 2.0   # docs/DESIGN.md section 10: [principled]

training:
  # Every value below is a reasonable starting point chosen by ordinary
  # ML-engineering judgment, NOT swept or tuned against this project's
  # data -- unlike the model hyperparameters above, none of these carry
  # a docs/DESIGN.md citation, because none has been decided as a project
  # commitment yet. Revisit once a real training run's curves say
  # otherwise.
  seed: 0
  max_epochs: 50
  patience: 5
  batch_size: 32
  learning_rate: 0.001
  grad_clip: 1.0               # matches training/loop.py's train_one_epoch default
  amp: true                    # only actually used when a CUDA device is available -- see scripts/02_train.py
  num_workers: 2                 # docs/DESIGN.md section 8; full measurement history in docs/FINDINGS.md
                                  # ("num_workers benchmarking", "SSD migration"). Steady-state (3rd epoch)
                                  # epoch time / dataloader-wait fraction on the current SSD:
                                  #   num_workers=0: 62.3s / 24.8%   num_workers=1: 42.9s / 0.9%
                                  #   num_workers=2: 41.9s / 0.9%    num_workers=4: 43.1s / 1.6%
                                  # Any num_workers >= 1 fully hides I/O behind GPU compute; 1/2/4 are within ~3%
                                  # of each other (bottleneck is now GPU compute, not I/O). num_workers=2 measured
                                  # marginally fastest and leaves more CPU headroom than 4. persistent_workers=True
                                  # and pin_memory=True are set in scripts/02_train.py whenever num_workers > 0,
                                  # not configurable from here.

logging:
  wandb_project: b2t-drift
  wandb_group: cutpoint_sweep   # training/logging.py: groups the sweep's runs together in the wandb UI
  mlflow_experiment: b2t-drift
